# Firebase App Hosting reads this file from GitHub on each rollout.
# Firebase project: gfinpay
# Create the backend in the Firebase console (App Hosting → GitHub), not with the CLI.
# https://firebase.google.com/docs/app-hosting/configure
scripts:
  buildCommand: npm run build
  runCommand: npm run start

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Set API_PROXY_TARGET in the Firebase console for this backend (Runtime).
# Value is the API origin with no trailing slash, for example:
# https://fintech-svc-xxxxx.asia-south1.run.app
# Do not set NEXT_PUBLIC_API_BASE_URL. The browser must call this app at /api/...
